  bounded_side_probe_wip_limit: 1
  publication_wip_limit: 1
  sole_executable_action_required: true
  publication_consumes_banked_science_only: true
  paper_readiness_never_promotes_scientific_grade: true
  historical_snapshots_never_route_current_work: true
  parked_work_requires_reopen_rule: true
  successor_is_selected_after_current_flagship: true
  anomaly_intake_is_not_a_standing_lane: true
status_enums:
  portfolio_status:
    - active
    - ready
    - parked
    - blocked
    - complete
    - external_custody
  execution_status:
    - executable
    - prepared
    - none
  dependency_type:
    - requires
    - tests
    - extracts_from
    - external_dependency
    - does_not_block
  dependency_target_type:
    - program
    - result
    - premise
    - prediction
    - requirement
    - external_work

run_home_contract:
  governed_run_home: lab/process/runs/
  legacy_run_home: runs/
  rule: >-
    New governed work uses lab/process/runs/. The root runs/ directory is
    preserved as non-routing historical evidence and receives no new runs.

transition_protocol:
  steps:
    - Write or close the dated evidence and governed run receipt.
    - Update current routing only in CURRENT-RESEARCH.yaml.
    - Increment state_revision for every committed live-state transition.
    - Validate the JSON Schema and semantic governance contract.
    - Commit explicit paths, push without force, and finish the repository session.
  history_rule: >-
    Never rewrite dated evidence or historical manifests to make them current;
    supersede them additively and route only through this file.

