    as non-routing historical evidence and receives no new runs.
transition_protocol:
  steps:
  - Write or close the dated evidence and governed run receipt.
  - Update current routing only in CURRENT-RESEARCH.yaml.
  - Increment state_revision for every committed live-state transition.
  - Validate the JSON Schema and semantic governance contract.
  - Commit explicit paths, push without force, and finish the repository session.
  history_rule: Never rewrite dated evidence or historical manifests to make them
    current; supersede them additively and route only through this file.
