  recorded in the governed run receipts.
scope: >-
  Sole mutable authority for Dynamic Unity research priority, work in
  progress, execution status, next actions, stop/reopen rules, and typed
  cross-repository dependencies.
non_authorities:
  - START-HERE.md
  - AGENTS.md
  - README.md
  - LANES.yaml
  - EARNED-RESULTS-INDEX.md
  - LANES-HISTORY.yaml
  - docs/certified-causal-reality-research-program.md
