  title: Literature and novelty collision
  purpose: >-
    Compare candidate results with known theorems, strongest standard accounts, absorbers and
    exact assumption boundaries.
  required_receipt: >-
    Source-pinned collision class, what is known, what is merely compatible and the residual
    search-incomplete contribution.
- id: CH-EMPIRICAL
  title: Experimental discriminators
