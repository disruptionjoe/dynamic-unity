lane_design_note: >-
  Lanes encode scientific responsibility and dependency; work_channels encode methods that
  operate across lanes. Lane 1 owns North-Star adjudication; Lane 2 the forward coherent
  representation; Lane 3 physical record formation and selection; Lane 4 observer access,
  certification and capability; Lane 5 regional finality and recursive composition; Lane 6 time,
  geometry, fields and physical reconstruction; Lane 7 remainders, predictions and publishable
  packages; Lane A stewardship. Dependencies grade claims but do not create a standing
  verification pipeline. Honesty is a per-lane practice and known challenges are terrain to
  beat, not automatic gates.
orientation_ref: START-HERE.md
orientation_rule: >-
  A cold-start agent reads AGENTS.md and START-HERE.md, then only this top-level
  program_charter, work_channels and active lanes topology before following relevant scientific
  pointers. legacy_lanes_* and dated revision receipts are historical context, not current
  routing authority.
near_term_approach_atlas_ref: >-
  explorations/near-term-research-swing-approach-atlas-2026-07-25.md
near_term_approach_atlas_rule: >-
  After selecting a plausible near-term problem and before designing execution, consult the
  five-lens approach family for its counterfactual, typed structure, hostile specimen, proof
  strategy, reusable artifact, scale trigger and stop/reopen rule. The atlas covers all 27 paper
  candidates and named non-paper dependencies but has no priority, activation, claim, evidence
  grade, Factory or publication authority.
next_five_swing_campaign_ref: >-
  explorations/next-five-swing-physical-selection-to-formed-descent-campaign-scaffold-2026-07-26.md
next_five_swing_campaign_rule: >-
  The prepared central campaign sequences one target-independent physical-ARE selector contract,
  independent Einstein--matter and localized-AQFT selector tests, a formed-descent or exact
  non-equivalence attempt, and a final North-Star adjudication. CCR-N5-S1 through S5 are complete
  as HC-DU-033F/G/H, HC-DU-035E and HC-DU-041. Treat the scaffold as a closed dependency receipt;
  future central work must consume the endogenous-compression gap and open a new bounded object.
endogenous_compressive_record_campaign_ref: >-
  explorations/next-five-swing-endogenous-compressive-record-campaign-scaffold-2026-07-26.md
endogenous_compressive_record_campaign_rule: >-
  The ECR-N5 campaign consumes HC-DU-041 and attacks H-CCR-17 through staged concentration.
  ECR-N5-S1 is complete as HC-DU-042 and returns NO_READY_ARENA: each compared mechanism
  selects or supports stable structure while leaving the complete provenance-bearing physical
  write underselected. The common minimum premise is a write-complete physical antecedent.
  ECR-N5-S2 is complete as HC-DU-043. One exact metastable generator selects the
  ready/retained classes, write/reset edge architecture, finite persistence bounds and value
  orbit up to Z2, but its terminal value cannot certify whether a write occurred during the
  interval. ECR-N5-S3 is complete as HC-DU-044. The minimum binary epoch transducer is unique,
  its exact set/reset maps cannot run reversibly on one closed bounded carrier, and a
  fresh-output completion can physically retain the history only by charging completion,
  support, retention and epoch structure that the matter host does not select. ECR-N5-S4 is
  complete as HC-DU-045. The unique finest A-only record common to the visible-archive and
  hidden-reservoir completions is terminal matter state. It strictly compresses history and
  reconstructs the next reduced-matter law, but not occurrence, count or event word. The
  cross-completion first leak is occurrence; inside the visible binary epoch record it is
  count. Full A-plus-H access repairs history only through an injective resource expansion.
  ECR-N5-S5 is complete as HC-DU-046. Terminal matter remains the finest common record at
  every horizon; historical occurrence first fails at the completed four-edge cycle and the
  witness survives positive weighting, lossless relabeling and benign subdivision. A declared
  full-history leak has exact Bayes risk equal to one minus reveal probability times endpoint
  ambiguity, and exact repair occurs only at complete revelation. The host-only antecedent is
  invariant under accessible/hidden archive relocation, so it cannot select archive location
  or access. The final host verdict is SELECTION_OR_FORMATION_OBSTRUCTION; full-environment
  repair is INJECTIVE_TOMOGRAPHY_ONLY.
next_five_host_closeout_sequence_ref: >-
  explorations/next-five-swing-host-closeout-to-record-selection-scaffold-2026-07-27.md
next_five_host_closeout_sequence_rule: >-
  The prepared N5-RS sequence was designed through ten inline divergent lenses and a triple
  diamond. It does not create a parallel campaign. Position 1 is complete as HC-DU-046 with
  host verdict SELECTION_OR_FORMATION_OBSTRUCTION. Joe interposed and completed the five-position
  N5-SCF stochastic/consensus/complexity/cryptography sequence as
  HC-DU-047/048/049/050/051. Its explicit handoff is RESUME_WITH_SHARPENED_INPUTS. Position 2
  retains identity N5-RS-P2 and is now executable; Positions 3 through 5 remain conditional on
  its portfolio receipt.
stochastic_consensus_finality_sequence_ref: >-
  explorations/next-five-swing-stochastic-consensus-finality-scaffold-2026-07-27.md
stochastic_consensus_finality_sequence_rule: >-
  The N5-SCF sequence was prepared through eighteen inline lenses: the five-person Science
  Council; Hashgraph/DAG, Avalanche/metastable, Byzantine consensus, epidemic propagation and MMO
  networking specialists; weak/strong emergence, stigmergy, scaling/universality,
  cascades/percolation and adaptive-network specialists; and zero-knowledge,
  homomorphic/MPC and threshold/DKG cryptographers. It preserves HC-DU-035A/035C and asks what
  amplification, propagation, provenance, metastability, hard finality, cryptographic
  verification, concealed computation and capability-relative filtering can add without
  creating information absent from the complete joint admitted input. All five positions are
  complete as HC-DU-047/048/049/050/051. HC-DU-047 proves deterministic and stochastic joint-input no-minting while correcting the
  individual-input overreach: XOR and threshold-secret-sharing correlations can be jointly
  exact while every local marginal is target-independent. IID evidence amplifies; copied,
  common-shock, clustered, higher-order-dependent, stigmergic and adversarially sampled evidence
  obey separately frozen bounds, and no universal effective-support scalar is earned. HC-DU-048
  proves that lossless gossip can pool complementary source information and signed hash-DAGs can
  preserve declared ancestry and encountered equivocation evidence, while physical source binding,
  common knowledge, total order and action safety remain separate. HC-DU-049 proves that
  metastable confidence, quorum-lock conflict safety, liveness and physical source truth remain
  distinct; hardening can close conflict-safe execution without improving source truth, while
  certificate compression can omit signer, fork, membership or formation provenance required by
  stronger audits. HC-DU-050 proves that incompatible incomplete regional views can each close a
  frozen local action without reconstructing global history; capability enlargement refines the
  relevant history quotient; commitment is not evidence availability; compact handoff is
  receiver-contextual and epoch-bound; and self-confirming filters can hide corrective evidence.
  HC-DU-051 applies the unchanged stack to the formed material gauge archive and the closed
  metastable host. Independent archive corruption lowers bounded readout risk while common shock
  does not; neither splits a source-record fibre. Boundary-flux closure and receiver-contextual
  handoff transfer physically. The first exact non-unification is authenticated representation
  versus causal physical source/action binding, captured also by the signed-render versus
  authoritative-collision dual-mesh control. N5-SCF is complete and N5-RS-P2 resumes with
  sharpened inputs. No model, hardware, paper, prediction or physics claim is promoted.
endogenous_record_mechanism_tournament_ref: >-
  explorations/endogenous-record-mechanism-tournament-and-write-selector-gap-2026-07-26.md
endogenous_record_mechanism_tournament_rule: >-
  A selected slow manifold, phase orbit, protected sector, pointer algebra, source family or
  redundant pattern is a potential record structure, not yet a formed record. Relative to a
  claimed physical antecedent a and write-complete interface xi_W, a write selector exists
  exactly when ker(a) is contained in ker(xi_W). Preserve blank carrier, physical write,
  occurrence provenance, persistence and reset as outputs to derive or classify from the
  physical microdynamics rather than semantic fields copied into the antecedent. HC-DU-042
  earns a scoped NO_READY_ARENA and minimum-premise obstruction, not a universal no-go.
  HC-DU-043 through HC-DU-046 have consumed and closed the first host. The scoped final verdict
  is SELECTION_OR_FORMATION_OBSTRUCTION, not a universal record no-go.
metastable_write_selector_result_ref: >-
  explorations/metastable-write-architecture-and-occurrence-tokenization-obstruction-2026-07-26.md
metastable_write_selector_result_rule: >-
  Relative to a frozen typed carrier, one exact timescale-separated Markov generator selects a
  write/retention architecture and two-value phase orbit up to Z2. Endpoint value does not
  retain occurrence provenance: equal-initial-state, equal-endpoint paths can differ on whether
  a write occurred, and any number of redundant terminal-value copies keeps the same fibre.
  A bounded exact repair requires a physically formed epoch/reset witness carrying at least one
  binary distinction; unbounded occurrence identity requires growing support, a bounded horizon
  or weakened semantics. HC-DU-044 now tests that repair: a fresh-output completion can retain
  history, but the host does not select its environment factorization, archive, or epoch reset.
  HC-DU-045 then shows that only terminal matter survives as the finest visible/hidden common
  record, reconstructing reduced future behavior but not historical occurrence. HC-DU-046
  proves this boundary at arbitrary horizon, gives the exact approximate-leak decision law,
  and closes the host through the archive-relocation obstruction.
matter_environment_epoch_archive_result_ref: >-
  explorations/matter-environment-epoch-archive-boundary-and-conditional-history-formation-2026-07-27.md
matter_environment_epoch_archive_result_rule: >-
  For the bounded proposition "a write occurred since the certified epoch reset," the two-state
  set/retain/reset transducer is necessary, sufficient and unique once event semantics are
  frozen. Its set and reset maps are many-to-one, so no closed reversible carrier can implement
  them on every admitted state; exact repetition requires restricted inputs, exported
  information, fresh support, bounded semantics or approximation. Resetting on the host's own
  turnover edge reproduces only its terminal ready/retained class. A specified fresh-output
  completion can physically form a full history record, and its binary quotient is strict and
  autonomous for the bounded occurrence capability, but the matter host does not select the
  completion, output fragment, retention, epoch or latch. Treat the host as
  SUPPLIED_EPOCH_ARCHIVE. HC-DU-045 now supplies the exact completion-common transfer boundary.
completion_common_transfer_result_ref: >-
  explorations/completion-common-record-quotient-and-two-tier-capability-leak-2026-07-27.md
completion_common_transfer_result_rule: >-
  For any finite family of native completion records, the unique finest target-independent
  common quotient has kernel equal to the equivalence join of their record kernels; exactly
  targets constant on that join transfer without refit. In the visible-archive/hidden-reservoir
  twin, the A-only common quotient is terminal matter state. It strictly compresses history and
  reconstructs the next reduced-matter law as Markov operational closure, but write occurrence,
  count and event word fail. Across completions the first capability leak is occurrence; inside
  the visible binary epoch record it is count. Full A-plus-H access reconstructs history only
  through an injective observer/action/resource expansion. Treat the host as
  NO_ENDOGENOUS_ARCHIVE for historical targets. HC-DU-046 supplies its final robustness and
  selection adjudication.
metastable_host_robustness_result_ref: >-
  explorations/metastable-host-robustness-and-archive-relocation-obstruction-2026-07-27.md
metastable_host_robustness_result_rule: >-
  For every prefix horizon, terminal matter is the finest visible/hidden A-only common record
  and reconstructs the next reduced-matter branch law. Historical occurrence, count and word
  first fail at the completed four-edge cycle and remain failed at every longer horizon.
  Positive stochastic weights preserve the support witness; lossless relabeling and benign
  subdivision preserve its kernels. Under complete-history reveal probability lambda and
  otherwise endpoint-only erasure, Bayes occurrence error is (1-lambda) times endpoint
  ambiguity mass; exact repair occurs only at lambda one and is injective. Any archive
  interface changed by accessible/hidden routing while the host antecedent stays fixed cannot
  factor through that antecedent. Close this host as SELECTION_OR_FORMATION_OBSTRUCTION, retain
  MARKOV_OPERATIONAL_CLOSURE as the positive control, and treat A-plus-H repair as
  INJECTIVE_TOMOGRAPHY_ONLY. N5-RS-P2 was the initially queued portfolio pivot; the interposed
  N5-SCF sequence is now complete as HC-DU-047/048/049/050/051 and recommends resumption with
  sharpened physical-source-formation inputs. Do not fit another archive to this host.
joint_input_amplification_result_ref: >-
  explorations/joint-input-no-minting-synergistic-recovery-and-dependency-sensitive-amplification-2026-07-27.md
joint_input_amplification_result_rule: >-
  If the complete joint participant input is a function or stochastic garbling of a common
  record Q, every downstream protocol certificate remains a function or garbling of Q and
  cannot reconstruct a target that fails on Q fibres. Individual insufficiency is not joint
  insufficiency: XOR and two-of-three Shamir controls recover a target exactly from a tuple
  whose individual marginals are target-independent. IID target-sensitive evidence
  concentrates, while copies and common shocks do not; clustered replication is controlled by
  origin structure, and marginal accuracy plus pairwise correlation do not determine threshold
  tails. Stigmergic replication approaches its trace-formation error floor. Zero knowledge,
  FHE/MPC and threshold cryptography alter verification, computation, disclosure or authority
  without certifying a physical target absent from the complete joint input. Treat effective
  support as model-relative. HC-DU-048 tests gossip/DAG propagation and provenance across
  matched synergy and null source worlds; HC-DU-049 tests the hardening boundary, HC-DU-050
  tests selective views and regional handoff, and HC-DU-051 completes the physical collision.
synergy_gossip_dag_provenance_result_ref: >-
  explorations/synergy-preserving-gossip-dag-provenance-and-knowledge-2026-07-27.md
synergy_gossip_dag_provenance_result_rule: >-
  A source-bound XOR world and a target-independent null world have the same complete payload law
  and therefore the same fixed signed-DAG artifact law. Lossless gossip pools complementary source
  information and turns distributed knowledge into recipient capability. Ideal signatures and
  parent hashes preserve declared origin and ancestry and a merged view can expose signed
  equivocation, but they do not identify physical source binding, physical independence, hidden
  branches or literal common knowledge. Endpoint value and total order do not identify route; raw
  path length fails benign-subdivision naturality while reachability among distinguished original
  events survives. An event-bound zero-knowledge proof certifies its declared relation, not an
  unmodeled physical target. HC-DU-049 tests metastable and Byzantine/threshold
  hardening; HC-DU-050 tests selective views and regional handoff; HC-DU-051
  completes the physical collision.
metastable_byzantine_provenance_result_ref: >-
  explorations/metastable-to-byzantine-hardening-and-provenance-lift-2026-07-27.md
metastable_byzantine_provenance_result_rule: >-
  In the frozen n=7, f=2, q=5 control, a correct non-conflicting lock turns
  quorum intersection into conflicting-certificate safety, while a 4-by-3
  partition preserves safety and blocks liveness. Metastable sampling risk depends on
  independence, routing and eclipse. The source-bound and target-independent null
  worlds have identical proposal-derived hardened-certificate laws, so hardening
  changes action safety rather than physical source truth. Explicit or bitmap-bearing
  certificates retain declared signers; ordinary group-key threshold verification may
  omit signer identity, and a plain final certificate need not retain rejected
  equivocation, membership epoch, controller independence or source formation.
  Certificate sufficiency is capability-indexed. Scoped composition requires source
  adequacy, validity adequacy, sampling accounting, conflict safety, liveness,
  certificate sufficiency, epoch/setup integrity and archive availability. HC-DU-050
  consumes this boundary and HC-DU-051 completes the physical collision.
capability_relative_selective_view_handoff_result_ref: >-
  explorations/capability-relative-selective-views-and-regional-handoff-2026-07-27.md
capability_relative_selective_view_handoff_result_rule: >-
  A selective view is sufficient for a frozen action exactly when the action factors through
  the view. Different incompatible incomplete regional views can each close their assigned
  local action without reconstructing global history, and joined complementary views can
  support a stronger audit. Capability enlargement refines the action-relevant history
  equivalence. Commitment binding does not imply evidence availability; the same compact
  certificate may be current or stale relative to receiver epoch; positive signed fork
  evidence is monotone under history extension while absence of a fork is not; and an adaptive
  self-confirming interest filter can hide corrective evidence. Safe handoff factors through
  the export plus declared receiver context and cannot mint a target absent from admitted
  upstream input. HC-DU-051 completes the physical collision and hands the sharpened premise to
  N5-RS-P2.
distributed_physical_collision_result_ref: >-
  explorations/distributed-physical-record-collision-and-portfolio-handoff-2026-07-27.md
distributed_physical_collision_result_rule: >-
  Every randomized replica, decoder, signature, proof, vote or hardening layer downstream of one
  formed physical record remains constant in law on that record's fibres. In the material Z3
  gauge anchor, independent archive corruption lowers bounded flux-readout risk across an odd-size
  family while common shock does not; neither creates interior, crossing or formation-history
  information. The archive exactly closes boundary-flux actions and physical handoff requires
  evidence availability, current epoch, calibrated orientation and a preserved boundary envelope.
  The first exact distributed/physical non-unification is authenticated declared origin versus
  causal physical source binding: a signed value can be QND-formed or preloaded. The MMO
  dual-mesh control states the same factorization boundary as signed render representation versus
  authoritative collision capability. The metastable host remains closed under replication,
  signing and hardening. N5-SCF is complete; resume N5-RS-P2 with sharpened inputs.
physical_are_selector_result_ref: >-
  explorations/antecedent-relative-physical-are-selector-and-minimum-premise-theorem-2026-07-26.md
physical_are_selector_result_rule: >-
  Physical ARE/interface selection is relative to a declared antecedent. It holds exactly when
  the formed ARE/interface architecture is constant on antecedent fibres. Otherwise return the
  minimal orbit, plural family, trivial interface or empty nontrivial target. Envelope selection,
  point selection, formation, access and joint realizability remain separately graded.
einstein_matter_selection_ladder_ref: >-
  explorations/einstein-matter-clock-observer-archive-selection-ladder-2026-07-26.md
einstein_matter_selection_ladder_rule: >-
  A realized stress tensor selects a future unit matter flow only where it has a simple timelike
  eigenline and a time orientation is supplied. Geodesic vorticity-free flow on a suitable
  topology selects an orthogonal proper-time scalar only up to an origin; homogeneous FLRW still
  leaves the observer worldline in a symmetry orbit, while Gödel dust selects a flow for which
  orthogonal synchronization is obstructed. Homogeneous archive transport preserves supplied
  data but does not mint a write, and causal reachability does not select a route, authentication,
  decoder or capability. Material clock, write/archive and observer-access/resource antecedents
  first close those fields at A2, A3 and A4 respectively. HC-DU-035E has consumed this exact
  partial/adverse receipt with the localized-AQFT receipt, and HC-DU-041 has consumed the
  public-shadow/native-lift distinction. Do not treat clock geometry as a formed record.
localized_aqft_selection_ladder_ref: >-
  explorations/localized-aqft-source-probe-pointer-archive-selection-ladder-2026-07-26.md
localized_aqft_selection_ladder_rule: >-
  A supplied Fewster--Verch target--probe coupling selects the induction map from probe
  preparations and effects to target observables/instruments, plus causal localization and
  factorization; it does not select one input to that map. A particular induced instrument and
  formed pointer/archive first close at A3. Observer access, decoder, resources, future actions,
  horizon and complete ARE first close at A4. No rung selects an actual outcome. Causal QFT
  operations strictly exceed the FV-realizable class in the scoped free-scalar/Weyl result, so
  realizability is a nontrivial plural filter rather than a point selector. Movable-cut target
  equivalence does not imply complete formed-record identity without an action-sufficiency proof.
  HC-DU-035E has consumed this exact partial/adverse receipt with the Einstein--matter receipt;
  HC-DU-041 has consumed the resulting public-shadow/native-lift distinction.
typed_public_shadow_descent_ref: >-
  explorations/typed-public-shadow-descent-and-native-interface-non-equivalence-2026-07-26.md
typed_public_shadow_descent_rule: >-
  Explicitly formed interfaces share one unchanged descent law only at the level of their
  complete public operational shadows. Require nonempty joint realization, certified
  occurrence/provenance identity, complete selective restrictions, physical and resource
  joinability, future-public center screening and benign-refinement naturality. Public-shadow
  equality does not establish native-interface identity. A copyable classical public record
  cannot also be a nondisturbing physically faithful lift of a noncommuting quantum state class
  without violating no-broadcasting. Preserve the public quotient, native residual fibre and
  frozen action envelope separately. CCR-N5-S4 is complete as HC-DU-035E and has been consumed by
  HC-DU-041; do not flatten the native arenas into one ledger.
capability_indexed_north_star_result_ref: >-
  explorations/capability-indexed-north-star-adjudication-and-endogenous-compression-gap-2026-07-26.md
capability_indexed_north_star_result_rule: >-
  Interface selection, held-out target reconstruction and complete behavior sufficiency under a
  frozen capability envelope are separate factorization receipts. If a record is final for H,
  every H-accessible target factors through it; a same-record target difference is therefore
  screened operational duality or a failure of H-finality, never both. Capability enlargement
  refines operational equivalence and requires a new finality verdict. Credit injective repairs
  as tomography, not strict record compression. No current specimen combines endogenous
  interface selection, formed noninjective compression, held-out physical transfer and no refit;
  H-CCR-17 is the next recommended central hypothesis, not an automatically active swing.
local_model_learning_gate_ref: lab/process/local-model-learning-gate.md
local_model_learning_gate_rule: >-
  Before a future simulation, toy model, solver, executable fixture, trained surrogate, emulator
  or adapter is used as a research path, show that the minimal local build can generate a
  decision-changing insight before hardware and beyond the bounded research-only baseline. If
  research or formal analysis supplies the same insight at equal grade, do that instead. If the
  first meaningful payoff requires hardware, do not build. Hardware may extend but not originate
  the first learning. Stop at the predeclared checkpoint when local learning fails.
certified_reconstruction_fiber_ref: >-
  explorations/certified-reconstruction-fiber-theorem-and-hostile-regional-case-2026-07-26.md
certified_reconstruction_fiber_rule: >-
  Every reconstruction assay first proves that the declared record has a nonempty fibre in the
  frozen completion and occurrence-identity class, then tests target constancy or returns a
  same-record/different-target witness. Empty fibre, nonempty underdetermination, same-class
  refinement, completion enlargement and identity/completion retyping are distinct outcomes.
law_interface_reconstruction_ref: >-
  explorations/law-interface-reconstruction-separation-and-3-plus-1-control-2026-07-26.md
law_interface_reconstruction_rule: >-
  Before crediting records for a held-out target, report the target diameter on the lawful
  completion class without record conditioning. A target already fixed by the law is law-only
  closure. Separately report whether the observer, instrument, archive, decoder and access
  interface is stabilizer-selected, selected only up to an orbit, supplied or fitted. Lawful
  target closure and interface selection are independent receipts.
certified_causal_spine_ref: >-
  explorations/certified-causal-reconstruction-formal-spine-and-two-anchor-freeze-2026-07-26.md
certified_causal_spine_rule: >-
  When a certified record is used as a recursively updateable state, require complete joint
  acquisition-stratum, response and next-record probabilities to agree across every
  same-record history under every admitted action. Keep this autonomous controlled quotient
  distinct from Blackwell sufficiency for a frozen tester family. Test realizability first,
  retain rejected/invalid/missing strata, receipt every retained reset memory, and refuse
  target-coded or representation-sensitive repairs. The mathematics is controlled strong
  lumpability/probabilistic bisimulation; the open scientific problem is physical formation
  and selection of the record/interface/refinement.
action_center_capability_ref: >-
  explorations/action-center-record-formation-and-capability-boundary-2026-07-26.md
action_center_capability_rule: >-
  Relative to an independently frozen finite physical action algebra, its minimal central
  projections are the finest action-internal sharp record whose Lueders channel preserves every
  admitted action. Explicit pointer/archive formation is permitted but not selected by that
  fact. The central record is an autonomous HC-DU-036H state exactly when every complete joint
  event-and-next-record effect is central, and it reconstructs all admitted action statistics
  exactly iff the action algebra is commutative. Preserve noncommutative within-sector state as
  a typed possible remainder; do not change the action class after seeing the sufficiency
  verdict.
center_screening_finality_ref: >-
  explorations/center-screening-regional-finality-and-first-leak-2026-07-26.md
center_screening_finality_rule: >-
  A formed regional public center is final relative to a frozen future action class exactly
  when every complete selective future map pulls the next public center into the current
  center. Require selective, not merely aggregate, center preservation. This condition composes
  sequentially, in parallel and under public-record-adaptive control while permitting the
  noncommutative fibre to remain intact. If a later public record depends on that fibre,
  propagate the final central effect backward to localize the first noncentral pullback and
  return its finite same-public-record witness. Adding a new noncentral recoupling changes the
  future-action contract; omitting an already available route is inadmissible restriction.
screened_effective_physics_ref: >-
  explorations/screened-effective-physics-and-source-attribution-rank-2026-07-26.md
screened_effective_physics_rule: >-
  A screened public process reconstructs its public order, trace laws and public-action
  capabilities, but complete public behavior reconstructed from itself is operational closure,
  not source derivation. Require an independently formed strict compression, held-out target
  transfer, source-independent calibration and no refitting. For an abelian source sensitivity
  S and held-out target T, reconstruction holds exactly when ker(S) is contained in ker(T).
  Treat a target-changing null direction as an attribution witness. One measured total phase
  does not identify proper-duration versus field/path source; an added independently calibrated
  sensitivity changes the interface and resource contract.
proper_time_certification_ref: >-
  explorations/proper-time-certification-hierarchy-and-source-attribution-null-2026-07-26.md
proper_time_certification_rule: >-
  Keep nonclassical-history certification, physical-source attribution and ontology as separate
  evidence axes. Mean clock signals and every two-level single-time dephasing factor remain
  classically or semiclassically simulable. A conditioned coherent-recombination channel can
  leave the convex hull of one independently frozen history set, but this does not identify its
  generator. If proper-time and coherent-control contributions enter through one total channel
  parameter, every output-only sensitivity retains the local null (1,-1), including complete
  tomography. Repair local coefficient attribution only with a preregistered source-selective
  intervention, frozen history provenance/controls/nuisances, held-out transfer and no
  refitting. Equivalent interpretations of one Hamiltonian remain operationally indistinguishable.
algebraic_qft_record_transport_ref: >-
  explorations/algebraic-qft-record-transport-and-capability-stable-finality-2026-07-26.md
algebraic_qft_record_transport_rule: >-
  The finite-PVM action-center theorem extends unchanged to unital von Neumann algebras: an
  internal sharp record preserves every admitted action exactly iff all record projections are
  central. A factor therefore has no nontrivial exact internal nondisturbing finite sharp
  record. In QFT-scale work, either independently restrict the effective action algebra,
  externalize a local source-probe-pointer-archive interface, use independently warranted
  sector/global/boundary structure, or state an approximate horizon-indexed claim. The split
  property can provide a subsystem arena under assumptions but does not select a record. Freeze
  the future capability envelope: exact finality is anti-monotone under action growth, while
  approximate leakage requires a compositional norm, finite horizon, and contraction, reset, or
  summable error control.
physical_arena_selection_ref: >-
  explorations/physical-arena-selection-tournament-2026-07-26.md
physical_arena_selection_rule: >-
  The post-HC-DU-040B tournament selected a materialized gauge-boundary sector recorder as the
  smallest next physical arena. Gauss law leaves total enclosed charge variable; a supplied
  external flux pointer/archive reconstructs that total exactly, while two interior charge
  distributions remain in one record fibre and one interior-sensitive action exposes the first
  capability leak. HC-DU-040D has now executed the finite mechanism handoff; consume its
  formation-orbit classification rather than reopening the arena comparison. Treat an algebraic
  center or unmaterialized edge mode as a boundary choice, not a selected record. Infrared QED
  remains parked until a finite-time finite-resolution access/horizon contract exists; the
  clock source-selective intervention remains a bounded side branch.
material_gauge_boundary_formation_ref: >-
  explorations/material-gauge-boundary-formation-orbit-and-first-leaks-2026-07-26.md
material_gauge_boundary_formation_rule: >-
  In the frozen finite Z3 gauge Hamiltonian, Gauss law selects the boundary-flux sectors and a
  local neutral qutrit permits an exact gauge-invariant QND write. Minimal additive record
  semantics select only the controlled-add/subtract formation orbit. A material
  orientation/calibration chooses one operational instrument; it does not select the
  microscopic Hamiltonian, intermediate micromotion, off-ready-subspace action, inaccessible
  dilation or fundamental outcome event. Finality is exact only for the declared
  projector-preserving boundary action envelope. Norm error earns a finite horizon; redundant
  hardening costs blank cells and assumes independent errors; interior readout, unlogged charge
  crossing and intermediate-time formation-history access are explicit first leaks. Bank this
  as a standard positive anchor, stop fitting the same endpoint instrument and open AQFT only
  for a new locality or selection proposition.
stabilizer_syndrome_logical_remainder_ref: >-
  explorations/stabilizer-syndrome-record-duality-and-logical-remainder-2026-07-26.md
stabilizer_syndrome_logical_remainder_rule: >-
  For an [[n,k]] stabilizer code, the complete generator-invariant syndrome reconstructs the
  Pauli quotient by the normalizer and is exactly sufficient for a frozen correctable
  error/recovery class. For the unrestricted Pauli class, the same-syndrome remainder modulo
  stabilizers is N(S)/S, the logical Pauli group of binary symplectic dimension 2k. No
  code-internal classical refinement can close this quotient while preserving arbitrary
  reference entanglement and the full logical action algebra. Charge logical measurement,
  external controller/noise logging, error/task restriction, coherent environment access, or
  code/decoder changes to the action, boundary, resource, completion, or interface contract.
  Bank this as a code-relative operational-duality/remainder anchor using known QEC mathematics,
  not a universal interface selector, ontological remainder, new QEC theorem, or reason to
  repeat stabilizer variants. A topological-phase successor is admissible only if it tests
  endogenous physical selection beyond a supplied commuting-projector code.
admissible_record_envelope_ref: >-
  explorations/admissible-record-envelope-and-einstein-matter-reconstruction-control-2026-07-26.md
admissible_record_envelope_rule: >-
  Freeze the complete process, gauge, observer boundary, action envelope, componentwise resource
  budget, provenance, formation/finality rule and target-independent admissibility criteria
  before comparing records. Order admissible records by lossless post-processing and separately
  record which interfaces are physically jointly realizable. A formal tuple of incompatible or
  jointly unaffordable records is contract retyping, not refinement. Use a greatest record when
  one exists; otherwise adjudicate every maximal interface and distinguish selector-free plural
  reconstruction, interface-selection dependence and a class-relative remainder through the
  whole frozen envelope. HC-DU-040D/E supply greatest-envelope controls. HC-DU-038E supplies the
  one-clock plural-remainder/two-clock resource-added reconstruction control. The open object is
  physical selection of the admissibility complex itself, not another supplied detector, code,
  or fitted sensor array.
program_charter:
  status: ratified
  date: '2026-07-25'
  authority: >-
    Joe direct chat after inline Science Council roses, buds, thorns and unanimous ratification;
    implemented by direct instruction in one governance-and-orientation swing.
  purpose: >-
    Make physical reality intelligible as one coherent, evidence-accountable whole.
  vision: >-
    Build a living, ontology-neutral architecture in which quantum dynamics, records, observers,
    capabilities, spacetime, fields, particles, thermodynamics, and cosmology are related at
    their honestly earned evidentiary grades—and use the unresolved seams to locate, classify,
    dissolve, or decisively test the tensions in present physics.
  mission: >-
    Construct, formalize, stress-test, and prepare for publication faithful representations,
    reconstruction theorems, countermodels, no-go results, and empirical discriminators that
    connect—or sharply separate—those layers.
  north_star: >-
    Determine whether independently selected, observer-indexed certified causal records
    reconstruct all observer-accessible time, geometry, fields, and capability—and identify a
    finite physical remainder wherever they do not.
  operating_principle: >-
    Whole-picture purpose. Seam-by-seam mission. Theorem-grade North Star.
  outcomes:
  - record_first_reconstruction
  - operational_duality
  - physics_first_remainder
  ontology_posture: >-
    No outcome is presumed. Underidentification is incomplete work, not a fourth ontology.
    Compatibility is not equivalence; representation is not derivation; operational equivalence
    is not ontological priority.
  forward_architecture: >-
    Accepted physical dynamics -> distinctions and interactions -> physically formed records and
    certificates -> observer access and action capability -> layered regional finality ->
    effective classical, temporal, geometric and field descriptions.
  inverse_test: >-
    From an independently specified observer-indexed certified causal network, either reconstruct
    all admitted observer-accessible physical predictions and capabilities up to a declared
    equivalence, or produce a finite intervention exposing the missing physical remainder.
evidence_grade_scale:
- id: 0
  label: vocabulary
  earns: Suggestive analogy or terminology only.
- id: 1
  label: compatibility
  earns: No identified conflict within a frozen declared scope.
- id: 2
  label: representation
  earns: A faithful map of known physical structure into the typed architecture.
- id: 3
  label: reconstruction
  earns: Recovery of target observables or capabilities up to a declared equivalence.
- id: 4
  label: selection_or_necessity
  earns: Independent dynamics selects the record structure or a theorem identifies necessary structure.
- id: 5
  label: remainder_or_prediction
  earns: A finite discriminator survives the complete admitted physical completion class.
