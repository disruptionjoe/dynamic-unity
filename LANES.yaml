lanes:
- id: '1'
  label: Lane 1
  ordinal: 1
  kind: progress
  title: Certified Causal Reality theorem spine
  north_star: true
  purpose: >-
    Prove or refute whether independently selected and certified causal histories are sufficient
    to reconstruct observer-accessible reality. Keep record-first reconstruction, operational
    duality and a finite physics-first remainder coequal, and turn every result into a scoped
    theorem, converse, no-go or discriminator rather than an ontology by vocabulary.
  purpose_type: north_star
  lead_bet: >-
    The decisive target is HC-DU-036, an Interventional Record-Sufficiency Dichotomy: within a
    declared class, a physical process either factors through an independently fixed
    certified-history quotient or a bounded-complexity intervention separates candidate
    realizations. HC-DU-033 record/interface selection is its first dependency. After that kernel
    is frozen, HC-DU-035 Quorum Objectivity is the first finite executable flagship.
  anchor:
    name: Certified Causal Sufficiency — factorization or finite physical-remainder witness
    elevated: '2026-07-24 (Joe direct chat; nineteen-lens triple-diamond convergence)'
    honest_standing: >-
      OPEN. Exact finite recorders, pointers and archives exist and expose covariance
      nonselection, necessary backreaction, complementarity, evidence conservation, resource
      costs, aliasing and graded boundary relocation. No record law, interface, observer, public
      finality, geometry, physical ontology or low-energy theory has been selected.
    success: >-
      A nontrivial necessary-and-sufficient theorem, tight bound, converse/no-go or finite
      separating witness in a declared model class, followed by the same typed statement on
      unlike physical and distributed fixtures without refitting.
  dependency_guard: >-
    Do not reconstruct time, geometry, classicality, capability, QFT, GR, GU or cosmology from a
    record object until the primitive, interface, access, intervention, adversary, resource and
    certification contracts are independently fixed. A negative selection theorem may move
    directly to a physics-first remainder; this is a scientific dependency, not a verification
    pipeline.
  channels:
  - id: '1.1'
    title: Primitive process, typed objects and record selection
    scope: >-
      Execute HC-DU-033. Freeze Upsilon, I, R, Gamma_R, C, chi, F, A_F, O, Q_O, Cap, G_O, the
      resource ledger and remainder witness. Type primitive operational precedence/composition
      separately from any supplied or reconstructed clock, metric, light cone, foliation or
      spacetime causal order. Enumerate the smallest equivariant record instruments under
      independently justified symmetry, locality and access constraints. Return a Record
      Selection Theorem, an Interface-Necessity No-Go, or a classified minimal
      additional-structure family. Do not build another merely admissible covariant recorder.
  - id: '1.2'
    title: Fresh-record dynamics and generativity
    scope: >-
      Determine what produces new persistent distinctions while charging recurrence, support,
      archive export, coherence, entropy and coarse-graining. Carry the exact finite-reuse
      trichotomy, HC-DU-014/024, the live portions of HC-DU-031 and causal-growth candidates.
      Fixed finite aliasing is not open-ended record production.
  - id: '1.3'
    title: Multi-time certification and public finality
    scope: >-
      Execute HC-DU-034 and HC-DU-035. Distinguish equal endpoints, mean histories, classical
      random-history mixtures, coherent histories and causal provenance. Derive fault- and
      access-relative certificate bounds, converse split views and conditions for a stable
      approximately commutative or broadcastable public actionable algebra. Redundancy,
      dissemination, confidence and decoherence are not finality by themselves.
  - id: '1.4'
    title: Interventional sufficiency and ontology discriminator
    scope: >-
      Execute HC-DU-036. Prove factorization through the certified-history quotient, construct a
      bounded separating intervention, or return a typed comparison-contract failure. Never
      define record equivalence by agreement under every target physical experiment.
  - id: '1.5'
    title: Meta-record time and geometry
    scope: >-
      Execute HC-DU-038 on independently fixed provenance/acquisition structure. Reconstruct
      effective spacetime causal order beyond primitive operational precedence, plus density,
      scale, dimension, proper-time comparison, reference-frame relations and reachable
      capability regions with uniqueness-up-to-gauge and nonisomorphic controls. Do not claim
      to derive primitive precedence from itself. Order alone is known terrain and does not
      satisfy this channel.
  - id: '1.6'
    title: Observer individuation, capability and resource laws
    scope: >-
      Execute HC-DU-037 and reuse HC-DU-032 only as an intervention-relative observer/system
      overlay. A certificate produces strict capability only if it separates action-relevant
      histories after risk, readout and verification cost. Test whether stronger public finality
      must consume support, redundancy, work/entropy or coherent/reversible optionality.
  - id: '1.7'
    title: Cross-platform invariance, physical recovery and applications
    scope: >-
      Execute HC-DU-039/040 after their dependencies. Require a shared typed statement across
      Clock-QCA, coherent proper-time, adversarial distributed, quantum-network and causal-set
      fixtures. Then test quantum/classical limits, AQFT/QFT locality, relativistic covariance,
      GR-like geometry, GU recovery/ablation, Standard Model compatibility and cosmology.
      Reopen Lambda~1/sqrt(N) only after a physically selected count, observable, family, scale,
      sign, coefficient and unit map exist.

- id: '2'
  label: Lane 2
  ordinal: 2
  kind: progress
  title: Conditional construction and rival-theory engine
  north_star: false
  purpose: >-
    Generate record-first, physics-first, dual and hybrid candidates by derivation, conditional
    construction, abduction, synthesis and structural analogy. Force every candidate onto the
    common typed kernel, strongest rival class, finite discriminator and stop/reopen contract.
    This is the divergent and heterodox engine; derivation is not the only warrant.
  purpose_type: independent_progress
  channels:
  - id: '2.1'
    title: Record-first candidate dynamics
    scope: >-
      Construct dynamics that independently selects records, interface, access and certification
      and attempts to generate observer-relative physics. GU/tachyon/source, causal growth,
      record-clock and archive candidates may enter only with current grades and explicit
      resource boundaries.
  - id: '2.2'
    title: Physics-first and operational-duality nulls
    scope: >-
      Give standard physical completions, hidden-state realizations, unrestricted gated clocks,
      smooth-memory models, ordinary databases and known quantum channels their strongest fair
      versions. Search for operational dualities and finite remainder witnesses rather than
      treating an unconstrained fit as identification.
  - id: '2.3'
    title: Conditional and abductive bridge construction
    scope: >-
      Use the non-ordinal candidate contract for cross-domain conjectures. Map quantum,
      consensus, database, control and causal-structure objects with explicit type, composition,
      free-choice and failure-scope tests. Analogy is not physical identity.
  - id: '2.4'
    title: Open-endedness, fresh records and multiscale organization
    scope: >-
      Test source-internal novelty, causal-post memory, open-system mechanisms, recursive
      viability, heterarchical observer covers and generated scale. Reject arbitrary drives,
      fitted windows, gratuitous hierarchy depth and free global access.
  - id: '2.5'
    title: GU ablation and rival unification tournament
    scope: >-
      Remove GU from each candidate to measure its unique contribution, then compare GU,
      record-first, causal-set, process, information-theoretic and conventional physical frames
      on one recovery, prediction, complexity, resource and evidence-independence contract.
  - id: 2.open
    title: Open candidate
    scope: >-
      Admit a new candidate only when it binds to the typed program kernel, a declared rival or
      adversary class, a finite cheap discriminator and an explicit local-versus-concept failure
      scope.

