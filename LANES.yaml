lane_contract_version: '2.0'
manifest_revision: 96
owner:
  owner_id: dynamic-unity
  display_name: Dynamic Unity
  scope_type: repository
  charter_ref: START-HERE.md
  governance_refs:
    - AGENTS.md
    - CONNECTIONS.md
  authoritative_state_refs:
    - CURRENT-RESEARCH.yaml
orientation_ref: START-HERE.md
current_research_ref: CURRENT-RESEARCH.yaml
historical_manifest_ref: LANES-HISTORY.yaml
lane_design_note: >-
  Lanes encode stable scientific responsibility. Work channels encode methods
  used across lanes. Neither surface selects current work; CURRENT-RESEARCH.yaml
  is the sole mutable routing authority.
program_charter:
  purpose: >-
    Make physical reality intelligible as one coherent, evidence-accountable
    whole.
  vision: >-
    Build a living, ontology-neutral architecture in which quantum dynamics,
    records, observers, capabilities, spacetime, fields, particles,
    thermodynamics, and cosmology are related at their honestly earned
    evidentiary grades—and use the unresolved seams to locate, classify,
    dissolve, or decisively test the tensions in present physics.
  mission: >-
    Construct, formalize, stress-test, and prepare for publication faithful
    representations, reconstruction theorems, countermodels, no-go results,
    and empirical discriminators that connect—or sharply separate—those
    layers.
  north_star: >-
    Determine whether independently selected, observer-indexed certified
    causal records reconstruct all observer-accessible time, geometry, fields,
    and capability—and identify a finite physical remainder wherever they do
    not.
  operating_principle: >-
    Whole-picture purpose. Seam-by-seam mission. Theorem-grade North Star.
  outcomes:
    record_first_reconstruction: open
    operational_duality: open
    physics_first_remainder: open
  outcome_rule: No outcome is presumed.
evidence_grades:
  - grade: 0
    label: vocabulary
  - grade: 1
    label: compatibility
  - grade: 2
    label: representation
  - grade: 3
    label: reconstruction
  - grade: 4
    label: selection_or_necessity
  - grade: 5
    label: remainder_or_prediction
work_channels:
  - id: CH-SYN
    title: Synthesis and compatibility atlas
    purpose: Integrate typed results without flattening assumptions or grades.
    required_receipt: Assumption map, typed dependencies, seams and non-promotions.
  - id: CH-FORMAL
    title: Formal proof and reconstruction
    purpose: Prove scoped theorems, no-gos, converses and exact boundaries.
    required_receipt: Definitions, assumptions, statement, proof boundary and counterexample.
  - id: CH-MODEL
    title: Executable models and counterexamples
    purpose: Produce minimal decision-changing local fixtures after the learning gate.
    required_receipt: Baseline, discriminator, checkpoint, artifact and stop.
  - id: CH-COLLIDE
    title: Literature and novelty collision
    purpose: Test scope and novelty against the strongest known absorbers.
    required_receipt: Search scope, closest results, surviving delta and citations.
  - id: CH-EMPIRICAL
    title: Experimental discriminators
    purpose: Freeze finite observables, controls, nulls and implementation completeness.
    required_receipt: Prediction, measurement, confounds, grade ceiling and hardware boundary.
  - id: CH-PAPER
    title: Paper production
    purpose: Extract one exact candidate from banked science without scientific promotion.
    required_receipt: Candidate ID, proof/literature gaps, scope, custody and stop.
  - id: CH-FRONTIER
    title: Speculative frontier
    purpose: Preserve falsifiable abductive and conditional possibilities at honest grade.
    required_receipt: Posit, consequence, strongest absorber, falsifier and retreat cost.
lanes:
  - id: '1'
    title: North-Star adjudication
    north_star: true
    purpose: Integrate the reconstruction, duality or physical-remainder verdict.
    depends_on:
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
    success_signal: A scoped theorem, exact non-unification or finite surviving discriminator.
    default_channel_ids:
      - CH-SYN
      - CH-FORMAL
      - CH-COLLIDE
    canonical_refs:
      - docs/certified-causal-reality-research-program.md
      - CURRENT-RESEARCH.yaml
    do_not: Treat coherence, representation or underidentification as the verdict.
  - id: '2'
    title: Forward representation and coherence
    north_star: false
    purpose: Build the typed physical-to-record picture and expose unresolved arrows.
    depends_on: []
    success_signal: A faithful scoped representation with assumptions and seams explicit.
    default_channel_ids:
      - CH-SYN
      - CH-FORMAL
      - CH-FRONTIER
    canonical_refs:
      - docs/certified-causal-reality-research-program.md
      - explorations/concept-register.md
    do_not: Promote a coherent map to derivation, selection or ontology.
  - id: '3'
    title: Physical record formation and selection
    north_star: false
    purpose: Derive or delimit interfaces, instruments, pointers, archives and robustness.
    depends_on:
      - '2'
    success_signal: An independently selected interface or an exact selection obstruction.
    default_channel_ids:
      - CH-FORMAL
      - CH-MODEL
      - CH-COLLIDE
    canonical_refs:
      - docs/certified-causal-reality-research-program.md
      - explorations/concept-register.md
    do_not: Confuse state selection, decoherence, copying or a supplied basis with record selection.
  - id: '4'
    title: Observer access, certification and capability
    north_star: false
    purpose: Freeze observer boundaries, actions, risks, resources and access semantics.
    depends_on:
      - '3'
    success_signal: Target-relative sufficiency or a finite capability-separating witness.
    default_channel_ids:
      - CH-FORMAL
      - CH-EMPIRICAL
      - CH-COLLIDE
    canonical_refs:
      - docs/certified-causal-reality-research-program.md
      - lab/process/cross-repo-hardening-control-contract.md
    do_not: Treat information existence, precision or verification as observer access or capability.
  - id: '5'
    title: Regional finality and recursive composition
    north_star: false
    purpose: Determine when local certified networks compose into safe higher-level facts and actions.
    depends_on:
      - '3'
      - '4'
    success_signal: A composition theorem, exact first leak or typed non-unification.
    default_channel_ids:
      - CH-FORMAL
      - CH-MODEL
      - CH-COLLIDE
    canonical_refs:
      - docs/certified-causal-reality-research-program.md
      - explorations/regional-finality-excess-audit-rate-mergeability-and-criticality-2026-07-27.md
    do_not: Import consensus thresholds, rates or common knowledge as physical finality by analogy.
  - id: '6'
    title: Time, geometry, fields and physical reconstruction
    north_star: false
    purpose: Reconstruct physical targets or expose the lawful record-relative remainder.
    depends_on:
      - '2'
      - '3'
      - '4'
      - '5'
    success_signal: Held-out reconstruction under a frozen law/interface or an exact lawful witness.
    default_channel_ids:
      - CH-FORMAL
      - CH-MODEL
      - CH-EMPIRICAL
    canonical_refs:
      - docs/certified-causal-reality-research-program.md
      - explorations/3-plus-1-law-filtered-record-assisted-reconstruction-and-causal-exterior-remainder-2026-07-27.md
    do_not: Smuggle the target clock, metric, foliation, field or decoder into the record.
  - id: '7'
    title: Remainders, predictions and publishable results
    north_star: false
    purpose: Extract finite discriminators, scoped theorems, novelty results and paper candidates.
    depends_on:
      - '1'
      - '3'
      - '4'
      - '5'
      - '6'
    success_signal: A falsifiable result or exact paper candidate at its earned scope.
    default_channel_ids:
      - CH-COLLIDE
      - CH-EMPIRICAL
      - CH-PAPER
    canonical_refs:
      - explorations/prediction-register.md
      - papers/PAPER-OPPORTUNITY-PORTFOLIO-2026-07-24.md
    do_not: Promote paper readiness, persona agreement or a conditional prediction to evidence.
  - id: A
    title: Stewardship
    north_star: false
    purpose: Preserve claim, type, dependency, provenance, reproducibility and custody integrity.
    depends_on: []
    success_signal: One recoverable authority, resolving references and reproducible receipts.
    default_channel_ids:
      - CH-SYN
      - CH-COLLIDE
      - CH-PAPER
    canonical_refs:
      - AGENTS.md
      - CURRENT-RESEARCH.yaml
    do_not: Turn governance into scientific evidence or silently rewrite dated receipts.
extensions:
  operating_architecture:
    contract_version: '1.0'
    operating_contract_refs:
