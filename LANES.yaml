    Specify complete instruments, calibration, metrology, uncertainty, systematic errors,
    matched resources and finite physical tests.
  required_receipt: >-
    Target and null channels, observables, units, uncertainty model, systematics, feasibility,
    predicted delta and kill criterion.
- id: CH-PAPER
  title: Paper production
  purpose: >-
    Package survived contributions, proofs, controls, novelty position and reproducibility for
    the Drafting Factory and Joe's publication decision.
  required_receipt: >-
    Stable source pointers, exact contribution, grade, audience, overlaps, blockers and
    reproducibility path. Joe alone publishes.
- id: CH-FRONTIER
  title: Speculative frontier
  purpose: >-
    Explore bold ontology, dynamics or cross-domain conjectures without demanding prior
    derivation and without confusing imagination with banking.
  required_receipt: >-
    Typed passport, warrant type, strongest foil, finite falsifier, stop/reopen condition and
    explicit maximum grade.
