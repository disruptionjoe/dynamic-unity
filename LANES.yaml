    The physical post-era projective sector begins at T_1; T_0 is irrelevant because empty-past
    births are excluded. Root corrected two draft probes to use t_eff=T_2/T_1 and reran all five
    artifacts. The square-root and tail-class results survive.
  established_antecedent: >-
    Classical sequential growth has the exact conditional post map
    T_n(P)=sum_k binom(P,k)t_(n+k). For the factorial family t_n=u^n/n!, the declared large-post
    regime conditionally gives t_eff~sqrt(u/P). This is known CSG prior art and locally
    recomputed, not a DU derivation.
  principal_narrowing: >-
    Post conditioning does not universally force a half-power. The family
    t_n=u^n/(n!)^alpha has saddle/finite-transform exponents -alpha/(alpha+1); tested alpha
    0,1/2,1,2 give 0,-1/3,-1/2,-2/3. The half-power therefore carries a bare-tail selection
    burden.
  inference_correction: >-
    Fixed-history replay rules out required online updates within one era, but cannot distinguish
    a fundamental frozen law from a complete effective law inherited from invariant prehistory.
    Cross-history intervention is required. Raw-to-physical Fisher retention is also not
    order-identified under hidden-fibre refinement.
  integrated_disposition: >-
    EXACT POST-RG ANTECEDENT RECOVERED / FACTORIAL HALF-POWER CONDITIONAL / UNIVERSAL POST
    HALF-POWER OVERTURNED / POST GENERATIVITY, GEOMETRY, ACTIVE RETURN, UNITS AND LAMBDA IDENTITY
